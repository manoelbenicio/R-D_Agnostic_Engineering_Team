AWSTemplateFormatVersion: '2010-09-09'
Description: ORQ-17 production bootstrap owner credential with a dedicated KMS key and server-side generated password.

Parameters:
  OwnerEmail:
    Type: String
    NoEcho: true
    MinLength: 3
    MaxLength: 320
    AllowedPattern: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
    Description: Application owner login stored only inside the generated JSON secret.
  ResolverPrincipalArn:
    Type: String
    Default: arn:aws:iam::809809509961:role/cw-agent-orquestradores
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/.+$'
    Description: Exact IAM role permitted to resolve this secret through Secrets Manager.

Resources:
  BootstrapOwnerKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Dedicated key for the ORQ-17 Multica bootstrap owner secret.
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      MultiRegion: false
      PendingWindowInDays: 30
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: EnableAccountIAMAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: '*'
          - Sid: AllowResolverOnlyThroughSecretsManager
            Effect: Allow
            Principal:
              AWS: !Ref ResolverPrincipalArn
            Action:
              - kms:Decrypt
              - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
                kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
              StringLike:
                kms:EncryptionContext:SecretARN: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:prod/multica/bootstrap-owner-*
          - Sid: AllowProvisioningOnlyThroughSecretsManager
            Effect: Allow
            Principal:
              AWS: !Ref ResolverPrincipalArn
            Action:
              - kms:Encrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: '*'
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
                kms:ViaService: !Sub secretsmanager.${AWS::Region}.amazonaws.com
              StringLike:
                kms:EncryptionContext:SecretARN: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:prod/multica/bootstrap-owner-*
      Tags:
        - Key: Environment
          Value: production
        - Key: Application
          Value: multica
        - Key: Control
          Value: ORQ-17
        - Key: ManagedBy
          Value: CloudFormation

  BootstrapOwnerKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: alias/prod/multica/bootstrap-owner
      TargetKeyId: !Ref BootstrapOwnerKey

  BootstrapOwnerSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: prod/multica/bootstrap-owner
      Description: ORQ-17 initial Multica application owner login; no workspace or membership grant.
      KmsKeyId: !GetAtt BootstrapOwnerKey.Arn
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"email":"${OwnerEmail}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\'
        ExcludeLowercase: false
        ExcludeNumbers: false
        ExcludePunctuation: false
        ExcludeUppercase: false
        IncludeSpace: false
        RequireEachIncludedType: true
      Tags:
        - Key: Environment
          Value: production
        - Key: Application
          Value: multica
        - Key: Control
          Value: ORQ-17
        - Key: ManagedBy
          Value: CloudFormation
        - Key: Rotation
          Value: owner-controlled-after-bootstrap

  BootstrapOwnerSecretPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      BlockPublicPolicy: true
      SecretId: !Ref BootstrapOwnerSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: secretsmanager:*
            Resource: !Ref BootstrapOwnerSecret
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: AllowExactBootstrapResolver
            Effect: Allow
            Principal:
              AWS: !Ref ResolverPrincipalArn
            Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Resource: !Ref BootstrapOwnerSecret

Outputs:
  SecretArn:
    Description: Full ARN for child-only asm-exec dynamic references; never a secret value.
    Value: !Ref BootstrapOwnerSecret
  KmsKeyArn:
    Description: Dedicated encryption key ARN.
    Value: !GetAtt BootstrapOwnerKey.Arn
  KmsAlias:
    Description: Dedicated encryption key alias.
    Value: !Ref BootstrapOwnerKeyAlias
