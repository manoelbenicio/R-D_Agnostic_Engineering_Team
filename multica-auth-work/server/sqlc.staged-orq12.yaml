# DISPOSABLE, TASK-SPECIFIC sqlc config for ORQ-12. DELETE ON PROMOTION.
#
# The canonical sqlc.yaml intentionally lists ONLY "migrations/", so a routine
# `sqlc generate` never silently types columns that `migrate up` cannot apply.
# This file exists so the ORQ-12 staged DDL, which still carries the
# NEXT_CANONICAL_* placeholder instead of a version number, can be typed into the
# generated code while it waits for the registrar.
#
# Use:   sqlc -f sqlc.staged-orq12.yaml generate
# On promotion: move the staged files into migrations/ with their assigned
# number, regenerate with the CANONICAL config, and delete this file. If the
# generated code ever fails to compile after a canonical generate, the cause is
# that this promotion step was skipped.
version: "2"
sql:
  - engine: "postgresql"
    queries: "pkg/db/queries/"
    schema:
      - "migrations/"
      - "migrations/staging/"
    gen:
      go:
        package: "db"
        out: "pkg/db/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
