name: Repository integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  object-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan newly reachable objects from a trusted baseline
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TIP_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          git cat-file -e "$TIP_SHA^{commit}"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "missing PR base SHA" >&2; exit 2; }
            baseline=$PR_BASE_SHA
          elif [[ "${BEFORE_SHA:-}" =~ ^[0-9a-f]{40}$ && "$BEFORE_SHA" != "$zero" ]]; then
            baseline=$BEFORE_SHA
          else
            [[ -n "${DEFAULT_BRANCH:-}" ]] || { echo "missing default branch" >&2; exit 2; }
            default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
            git show-ref --verify --quiet "$default_ref" || { echo "default branch ref unavailable" >&2; exit 2; }
            baseline=$(git merge-base "$TIP_SHA" "$default_ref")
            [[ "$baseline" =~ ^[0-9a-f]{40}$ ]] || { echo "new-branch merge base unavailable" >&2; exit 2; }
          fi
          git cat-file -e "$baseline^{commit}"
          python3 scripts/ops/git-object-size-gate.py --range "$baseline..$TIP_SHA"
      - name: Run integrity fixtures
        run: bash scripts/ops/tests/git-object-size-gate-test.sh
